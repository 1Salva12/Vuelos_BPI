<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vuelos BPI | Sistema de Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { font-family: 'Urbanist', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .dashboard { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 400px; text-align: center; border: 1px solid #334155; }
        h1 { font-size: 24px; margin-bottom: 30px; letter-spacing: -0.5px; }
        select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: #000; font-weight: 700; cursor: pointer; margin-top: 20px; transition: opacity 0.3s; }
        button:hover { opacity: 0.9; }
        .resultado { margin-top: 30px; padding: 20px; background: #0f172a; border-radius: 12px; border-left: 4px solid var(--accent); }
        .ruta-item { font-weight: 700; color: var(--accent); }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>vuelos_bpi</h1>
        <form action="/buscar" method="POST">
            <select name="inicio" required>
                {% for c in ciudades %}<option value="{{ c }}" {% if c == inicio %}selected{% endif %}>{{ c }}</option>{% endfor %}
            </select>
            <select name="meta" required>
                {% for c in ciudades %}<option value="{{ c }}" {% if c == meta %}selected{% endif %}>{{ c }}</option>{% endfor %}
            </select>
            <button type="submit">Calcular Ruta Óptima</button>
        </form>

        {% if ruta %}
            <div class="resultado">
                <small>Camino encontrado:</small>
                <p>{{ ' ➔ '.join(ruta) }}</p>
            </div>
        {% elif request.method == 'POST' %}
            <div class="resultado" style="border-color: #ef4444;">No hay conexión disponible.</div>
        {% endif %}
    </div>
</body>
</html>
